# Dependabot — keep CI actions and npm deps from rotting quietly
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Only batch minor/patch updates. Majors (e.g. typescript 6→7,
    # @types/node 22→26) open as individual PRs so CI breakage is isolated.
    groups:
      production-deps:
        dependency-type: production
        update-types:
          - "minor"
          - "patch"
      development-deps:
        dependency-type: development
        update-types:
          - "minor"
          - "patch"
    labels:
      - dependencies
    # TS 7 not usable yet: vue-tsc lacks ./lib/tsc export; typescript-eslint
    # peers are typescript <6.1.0. Revisit when both support TS 7.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
